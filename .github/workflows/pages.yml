name: Deploy to GitHub Pages

# The site is the Verso version (site/): every lesson's Lean is checked by real Lean while the
# pages are built, so this installs Lean and Mathlib's prebuilt files first.
on:
  push:
    branches: [main]
    # a change to the docs alone does not change the site
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # where the Makefile keeps Lean and Mathlib's download cache
  ELAN_HOME: ${{ github.workspace }}/.tools/elan
  MATHLIB_CACHE_DIR: ${{ github.workspace }}/.tools/mathlib-cache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Mathlib's built files take about 7 GB: make room
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # the course data the questions come from: content and practice checks
      - run: npm test
        working-directory: frontend

      - name: Install Lean
        run: |
          mkdir -p .tools
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o .tools/elan-init.sh
          sh .tools/elan-init.sh -y --no-modify-path --default-toolchain none
          echo "$ELAN_HOME/bin" >> "$GITHUB_PATH"
          "$ELAN_HOME/bin/elan" toolchain install "$(cat lean/lean-toolchain)"
          "$ELAN_HOME/bin/elan" default "$(cat lean/lean-toolchain)"

      # Verso and the site's own build, kept between runs (Mathlib comes from its own cache below)
      - uses: actions/cache@v4
        with:
          path: |
            site/.lake
            mathlib/.lake/packages/verso
            mathlib/.lake/packages/subverso
            mathlib/.lake/packages/MD4Lean
            mathlib/.lake/packages/illuminate
          key: verso-${{ hashFiles('site/lake-manifest.json', 'mathlib/lake-manifest.json', 'lean/lean-toolchain') }}-${{ github.sha }}
          restore-keys: verso-${{ hashFiles('site/lake-manifest.json', 'mathlib/lake-manifest.json', 'lean/lean-toolchain') }}-

      # Mathlib's prebuilt files, at the versions pinned in mathlib/lake-manifest.json
      # (no `lake update`, so the versions stay exactly those)
      - name: Get Mathlib
        run: lake exe cache get
        working-directory: mathlib

      # the question widgets, then the Lean-checked pages, then the check that the pages and the
      # course data agree
      - run: make verso

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/_out/html-multi

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
