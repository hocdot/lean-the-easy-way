<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- what search engines show: the title, and the line under it -->
    <title>Lean for All: Lean the easy way</title>
    <meta
      name="description"
      content="Lean for All teaches you, the easy way, to read Lean proofs and audit AI-generated ones: short daily lessons, multiple-choice practice, and hands-on audits of real theorems. Free, no installation."
    />
    <link rel="canonical" href="https://hocdot.github.io/lean-the-easy-way/" />

    <!-- the card shown when the link is shared (Slack, X, LinkedIn, Messenger…) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lean for All" />
    <meta property="og:title" content="Lean for All: Lean the easy way" />
    <meta property="og:description" content="Learn to read Lean proofs and audit AI-generated ones, a little every day." />
    <meta property="og:url" content="https://hocdot.github.io/lean-the-easy-way/" />
    <meta property="og:image" content="https://hocdot.github.io/lean-the-easy-way/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- a machine-readable description of the course, for search engines' course listings -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Course",
        "name": "Lean for All: Lean the easy way",
        "description": "An interactive course that teaches you to read Lean, the proof assistant, and audit AI-generated proofs for vacuous hypotheses, circular statements, sorry, axioms and statements that do not match the claim.",
        "url": "https://hocdot.github.io/lean-the-easy-way/",
        "inLanguage": "en",
        "isAccessibleForFree": true,
        "educationalLevel": "Beginner",
        "teaches": ["Lean 4", "reading formal proofs", "auditing AI-generated proofs"],
        "provider": { "@type": "Person", "name": "hocdot", "url": "https://github.com/hocdot" },
        "hasCourseInstance": { "@type": "CourseInstance", "courseMode": "online", "courseWorkload": "PT5H" }
      }
    </script>

    <script>
      // apply the saved theme before the first paint, so there is no flash
      try {
        const t = localStorage.getItem('theme')
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t)
      } catch {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- for visitors (and crawlers) without JavaScript: the same summary the site shows -->
    <noscript>
      <h1>Lean for All: Lean the easy way</h1>
      <p>
        An interactive course that teaches you to read Lean, the proof assistant, and audit AI-generated proofs: 30 short
        daily lessons, multiple-choice practice aimed at what you mix up, and hands-on audits of real theorems such as
        Cantor's theorem, Euclid's infinitely many primes and Fermat's Last Theorem. This site needs JavaScript.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
