name = "tutor"
defaultTargets = ["Tutor", "tutor-run"]

# Tutor.Audit: the `#tutor_audit` command the runner appends when auditing
[[lean_lib]]
name = "Tutor"

# Runs a Lean file from stdin and prints its messages, tactic steps and audit as JSON
[[lean_exe]]
name = "tutor-run"
root = "Main"
supportInterpreter = true
